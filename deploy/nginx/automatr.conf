# /etc/nginx/conf.d/automatr.conf  - CloudFront -> nginx :80 -> node :5050
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 30m;          # MAX_UPLOAD_MB=25 + headroom

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;        # long AI image/video calls
        proxy_buffering off;
    }
}
