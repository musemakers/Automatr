version: 0.0
os: linux
files:
  - source: /
    destination: /var/www/automatr
file_exists_behavior: OVERWRITE
hooks:
  BeforeInstall:
    - location: deploy/scripts/before_install.sh
      timeout: 120
      runas: root
  AfterInstall:
    - location: deploy/scripts/after_install.sh
      timeout: 900
      runas: root
  ApplicationStart:
    - location: deploy/scripts/application_start.sh
      timeout: 120
      runas: root
  ValidateService:
    - location: deploy/scripts/validate_service.sh
      timeout: 180
      runas: root
